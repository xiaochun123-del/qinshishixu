<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集卡册 · 秦时食序</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="page">
  <a href="seasons.html" class="back-link">← 返回四时</a>
  <div class="page-head"><h2>秦味集卡册</h2><p>点亮属于你的三秦味道</p></div>

  <div class="collect-top">
    <div class="ring" id="ring"><div><b id="ringPct">0%</b><small>收集进度</small></div></div>
    <div class="cstats">
      <div class="cstat"><b id="stEaten">0</b><span>已吃美食</span></div>
      <div class="cstat"><b id="stLeft">0</b><span>待解锁</span></div>
      <div class="cstat"><b id="stCity">0</b><span>打卡城市</span></div>
    </div>
  </div>

  <div id="groups"></div>

  <div class="season-extra" style="margin-top:50px;">
    <a href="mbti.html" class="cta-btn">测测你的美食人格 →</a>
    <a href="extra.html" class="cta-btn">去探索坊（收藏/留念）</a>
  </div>
</section>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
renderNav('collection');
const TYPES = ['面食', '馍饼', '凉皮米皮', '汤羹炖菜', '腊味荤食', '甜品甜心'];

function renderCards() {
  const unlocked = getUnlocked();
  const total = FOODS.length;
  const eaten = unlocked.length;
  const cities = new Set(FOODS.filter(f => unlocked.includes(f.id)).map(f => f.city)).size;
  const pct = Math.round(eaten / total * 100);

  $('#ring').style.setProperty('--p', (pct * 3.6) + 'deg');
  $('#ringPct').textContent = pct + '%';
  $('#stEaten').textContent = eaten;
  $('#stLeft').textContent = total - eaten;
  $('#stCity').textContent = cities;

  const groups = $('#groups');
  groups.innerHTML = TYPES.map(t => {
    const list = FOODS.filter(f => f.type === t);
    const got = list.filter(f => unlocked.includes(f.id)).length;
    const p = Math.round(got / list.length * 100);
    
    return `<div class="cgroup">
      <div class="cgroup-head">
        <h3>${t}</h3>
        <div class="bar"><i style="width:${p}%"></i></div>
        <span class="n">${got} / ${list.length}</span>
      </div>
      <div class="cardgrid">
        ${list.map(f => {
          const isGot = unlocked.includes(f.id);
          const bgStyle = `background-image: ${getImgBg(f.id)};`;
          return `<div class="gcard ${isGot?'got':''}" onclick="openDish('${f.id}')">
            <div class="thumb" style="${bgStyle}"></div>
            <div class="cn">${isGot ? f.name : '未点亮'}</div>
            <div class="cc">${f.city} · ${f.taste}</div>
            <span class="tk" style="z-index:2;">${isGot?'✓':'+'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function openDish(id) {
  const f = FOODS.find(x => x.id === id);
  if (!f) return;
  const isGot = getUnlocked().includes(id);
  $('#modal').innerHTML = `
    <div class="mhead"><button class="close" onclick="closeModal()">×</button><h3>${f.name}</h3></div>
    <div class="mbody"><p class="desc">${f.desc}</p></div>
    <div class="mfoot"><button class="btn ${isGot?'jade':'pri'}" onclick="toggleEat('${f.id}')">${isGot ? '已点亮 ✓' : '点亮打卡'}</button></div>`;
  $('#mask').classList.add('on');
}
function closeModal() { $('#mask').classList.remove('on'); }

function toggleEat(id) {
  let unlocked = getUnlocked();
  if (unlocked.includes(id)) { unlocked = unlocked.filter(x => x !== id); toast('取消点亮'); }
  else { unlocked.push(id); toast('点亮成功'); playDing(); }
  saveUnlocked(unlocked);
  renderCards();
  closeModal();
}
renderCards();
</script>
</body>
</html>
