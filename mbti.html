<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美食人格 · 秦时食绘</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== 盲盒揭晓动画遮罩层 ===== */
  .reveal-mask {
    position: fixed;
    inset: 0;
    background: rgba(8, 5, 3, 0.95);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .reveal-mask.on {
    opacity: 1;
    pointer-events: auto;
  }
  
  /* 卷轴/印章主体 */
  .reveal-box {
    width: 150px; height: 150px;
    border: 4px solid var(--gold);
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-family: "STXingkai", "STKaiti", serif;
    font-size: 70px; color: var(--gold);
    box-shadow: 0 0 30px rgba(201, 161, 90, 0.4), inset 0 0 20px rgba(201, 161, 90, 0.4);
    transform: scale(0.5) rotate(-180deg);
    transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
  }
  
  /* 揭示时的金光炸裂 */
  .reveal-mask.on .reveal-box {
    transform: scale(1) rotate(0deg);
    animation: goldFlash 1.5s ease-out forwards;
  }

  @keyframes goldFlash {
    0% { box-shadow: 0 0 30px rgba(201, 161, 90, 0.4); }
    50% { box-shadow: 0 0 100px rgba(201, 161, 90, 1), inset 0 0 50px rgba(201, 161, 90, 1); background: rgba(201, 161, 90, 0.2); }
    100% { box-shadow: 0 0 200px rgba(201, 161, 90, 0), inset 0 0 100px rgba(201, 161, 90, 0); background: transparent; transform: scale(1.5); opacity: 0; }
  }

  .reveal-text {
    margin-top: 30px;
    color: var(--gold-l);
    font-size: 16px;
    letter-spacing: 0.5em;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s 0.5s;
  }
  .reveal-mask.on .reveal-text {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<section class="page">
  <a href="seasons.html" class="back-link">← 返回四时</a>
  <div class="page-head">
    <h2>你是哪一味陕西美食？</h2>
    <p>八道题，测出你的秦味人格</p>
  </div>
  <div id="quizBox"></div>
</section>

<!-- 新增：全屏揭晓遮罩 -->
<div class="reveal-mask" id="revealMask">
  <div class="reveal-box">启</div>
  <div class="reveal-text">正在为你寻得一味...</div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/mbti.js"></script>
</body>
</html>
